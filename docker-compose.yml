version: '3.8'

services:
  # ============================================================================
  # Oracle Database 26ai Container
  # ============================================================================
  oracle-26ai:
    # Official Oracle Enterprise Edition image
    # Alternative: oracle/database:23-slim (lightweight version)
    image: container-registry.oracle.com/database/enterprise:26.0.0.0
    
    container_name: kumari-oracle-26ai
    
    hostname: oracle-26ai
    
    # Environment configuration
    environment:
      # Oracle SID (System Identifier)
      ORACLE_SID: ORCL
      
      # Pluggable Database name
      ORACLE_PDB: ORCLAPDB
      
      # Administrator password (CHANGE THIS IN PRODUCTION)
      ORACLE_ADMIN_PASSWORD: YourSecurePassword123!
      
      # Character set for international support
      ORACLE_CHARACTERSET: AL32UTF8
      
      # Edition: enterprise, standard, or express
      ORACLE_EDITION: enterprise
      
      # Memory allocation (adjust based on available RAM)
      ORACLE_MEM: 2G
      
      # Enable automated backups
      ENABLE_ARCHIVELOG: "true"
    
    # Port mappings
    ports:
      # Oracle Listener (Main database port)
      - "1521:1521"
      
      # Enterprise Manager Express (Admin console)
      # Access via: https://localhost:5500/em
      - "5500:5500"
    
    # Volume mounts for persistent data
    volumes:
      # Main data directory
      - oracle-data:/opt/oracle/oradata
      
      # Initialization scripts directory
      - oracle-scripts:/docker-entrypoint-initdb.d
      
      # SQL scripts to run on startup
      - ./scripts:/docker-entrypoint-initdb.d/sql:ro
      
      # Backup directory
      - oracle-backups:/opt/oracle/backups
      
      # Flash recovery area
      - oracle-fra:/opt/oracle/fra
    
    # Health check configuration
    healthcheck:
      # Command to check if DB is healthy
      test: ["CMD", "sqlplus", "-h"]
      
      # Initial delay before first check (seconds)
      start_period: 120
      
      # Interval between checks
      interval: 30
      
      # Timeout for check command
      timeout: 10
      
      # Number of failed checks before unhealthy
      retries: 5
    
    # Network configuration
    networks:
      - kumari-net
    
    # Restart policy
    restart: unless-stopped
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    
    # User to run container
    user: oracle:dba
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  # ============================================================================
  # Oracle SQL Plus Client (Optional - for development)
  # ============================================================================
  sqlplus-client:
    image: container-registry.oracle.com/database/sqlcl:latest
    
    container_name: kumari-sqlplus
    
    # Only start when explicitly requested
    profiles:
      - tools
    
    # Depends on Oracle database
    depends_on:
      oracle-26ai:
        condition: service_healthy
    
    # Environment
    environment:
      SQLPLUS_PATH: /opt/oracle/sqlcl/bin
    
    # Network
    networks:
      - kumari-net
    
    # Interactive terminal
    stdin_open: true
    tty: true
    
    # Command to run
    command: /bin/bash

  # ============================================================================
  # Optional: pgAdmin for Database Management (if using PostgreSQL tools)
  # Uncomment if you want a web-based DB admin interface
  # ============================================================================
  # adminer:
  #   image: adminer:latest
  #   container_name: kumari-adminer
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     ADMINER_DEFAULT_SERVER: oracle-26ai
  #   depends_on:
  #     - oracle-26ai
  #   networks:
  #     - kumari-net

# ============================================================================
# NAMED VOLUMES
# ============================================================================
volumes:
  # Main Oracle data directory
  oracle-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${PWD}/oracle-data"
  
  # Initialization scripts
  oracle-scripts:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${PWD}/oracle-scripts"
  
  # Backup directory
  oracle-backups:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${PWD}/oracle-backups"
  
  # Flash Recovery Area (for backups)
  oracle-fra:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${PWD}/oracle-fra"

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  kumari-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
